; DCO4 Voice Board
; Libraries: board _build_libs only (do not scan the whole Arduino sketchbook)
; arduino-cli: rp2040:rp2040:rpipico2:usbstack=tinyusb,flash=4194304_524288,opt=Fast,usbname=dco4_reborn
;   --build-property 'build.usb_manufacturer="DCO4"' --build-property 'build.usb_product="DCO4-REBORN"'

[platformio]
description = DCO4 Voice Board
src_dir = .
default_envs = rpipico2

[env]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
framework = arduino
board_build.core = earlephilhower
board_build.usb_stack = tinyusb
board_build.arduino.earlephilhower.usb_manufacturer = DCO4
board_build.arduino.earlephilhower.usb_product = DCO4-REBORN
; Arduino IDE: Tools → Optimize → Fast (-Ofast)
build_unflags = -Os
build_flags =
  -Ofast
  -DUSE_TINYUSB
lib_ldf_mode = deep+
lib_archive = no
lib_ignore =
  MO-LFO
lib_extra_dirs =
  ${platformio.src_dir}/_build_libs
monitor_speed = 2000000
; Do not use Auto/ttyACM*: every Pico has the same VID/PID. Bind to USB product name.
custom_usb_by_id = /dev/serial/by-id/usb-*DCO4?REBORN*
monitor_port = /dev/serial/by-id/usb-*DCO4?REBORN*
upload_port = /dev/serial/by-id/usb-*DCO4?REBORN*
upload_protocol = picotool
extra_scripts = post:no_verify_upload.py
build_src_filter =
  +<*>
  -<_build_libs/>
  -<docs/>
  -<tools/>

[env:rpipico2]
board = rpipico2
board_build.filesystem_size = 0.5m
; Arduino IDE: Tools → CPU Speed
board_build.f_cpu = 250000000L

[env:dco_pico]
board = pico
; Arduino IDE: Tools → CPU Speed
board_build.f_cpu = 225000000L
